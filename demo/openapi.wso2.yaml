version: api-platform.wso2.com/v1
kind: http/rest
data:
  name: Library Management API
  version: 1.0.0
  context: /library-management-api-test
  description: API for managing a library system, including books, authors, and borrowers.
  upstream:
    - url: https://api.librarymanagement.com/v1
  operations:
    - method: GET
      path: /books
    - method: POST
      path: /books
    - method: GET
      path: /books/{bookId}
    - method: PUT
      path: /books/{bookId}
    - method: DELETE
      path: /books/{bookId}
    - method: POST
      path: /auth/login
    - method: POST
      path: /auth/logout
    - method: GET
      path: /sample-resource
