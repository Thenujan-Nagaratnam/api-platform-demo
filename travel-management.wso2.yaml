version: api-platform.wso2.com/v1
kind: http/rest
data:
  name: Travel Management API
  version: 1.0.0
  context: /travel-management-api-test
  description: API for managing travel plans, bookings, and itineraries.
  upstream:
    - url: https://api.travelmanagement.com/v1
  operations:
    - method: GET
      path: /trips
    - method: POST
      path: /trips
    - method: GET
      path: /trips/{tripId}
    - method: PUT
      path: /trips/{tripId}
    - method: DELETE
      path: /trips/{tripId}
    - method: POST
      path: /auth/login
    - method: POST
      path: /auth/logout
