openapi: 3.0.3
info:
  title: Travel Management API
  description: API for managing travel plans, bookings, and itineraries.
  version: 1.0.0
  contact:
    name: API Support
    email: support@travelmanagement.com
servers:
  - url: https://api.travelmanagement.com/v1
    description: Production server
  - url: https://sandbox.api.travelmanagement.com/v1
    description: Sandbox server
tags:
  - name: Trips
    description: Operations related to trips.
    externalDocs:
      description: Learn more about Trips
      url: https://docs.travelmanagement.com/trips
  - name: Authentication
    description: Operations related to user authentication.
    externalDocs:
      description: Learn more about Authentication
      url: https://docs.travelmanagement.com/authentication
paths:
  /trips:
    get:
      summary: Retrieve all trips
      description: Retrieve a list of all trips. Requires an API key for authentication.
      operationId: getAllTrips
      tags:
        - Trips
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: A list of trips.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
              examples:
                example1:
                  summary: Example response
                  value:
                    - id: 1
                      destination: Paris
                      startDate: '2023-12-01'
                      endDate: '2023-12-10'
                    - id: 2
                      destination: New York
                      startDate: '2024-01-15'
                      endDate: '2024-01-20'
        '400':
          description: Bad request. Invalid parameters.
        '500':
          description: Internal server error.
    post:
      summary: Create a new trip
      description: Add a new trip to the system. Requires an API key for authentication.
      operationId: createTrip
      tags:
        - Trips
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        description: Details of the trip to be created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTrip'
            examples:
              example1:
                summary: Example request
                value:
                  destination: Tokyo
                  startDate: '2024-03-01'
                  endDate: '2024-03-10'
      responses:
        '201':
          description: Trip created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Bad request. Invalid input data.
        '500':
          description: Internal server error.
  /trips/{tripId}:
    get:
      summary: Retrieve trip details
      description: Retrieve details of a specific trip by ID. Requires an API key for authentication.
      operationId: getTripById
      tags:
        - Trips
      security:
        - ApiKeyAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the trip.
          example: 1
      responses:
        '200':
          description: Trip details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          description: Trip not found.
        '500':
          description: Internal server error.
    put:
      summary: Update trip details
      description: Update details of an existing trip. Requires an API key for authentication.
      operationId: updateTrip
      tags:
        - Trips
      security:
        - ApiKeyAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the trip.
          example: 1
      requestBody:
        required: true
        description: Updated details of the trip.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTrip'
            examples:
              example1:
                summary: Example request
                value:
                  destination: London
                  startDate: '2024-05-01'
                  endDate: '2024-05-10'
      responses:
        '200':
          description: Trip updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          description: Trip not found.
        '500':
          description: Internal server error.
    delete:
      summary: Delete a trip
      description: Remove a trip from the system. Requires an API key for authentication.
      operationId: deleteTrip
      tags:
        - Trips
      security:
        - ApiKeyAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the trip.
          example: 1
      responses:
        '204':
          description: Trip deleted successfully.
        '404':
          description: Trip not found.
        '500':
          description: Internal server error.
  /auth/login:
    post:
      summary: User login
      security:
        - ApiKeyAuth: []
      description: Authenticate a user and return a token.
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        description: User credentials for login.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              example1:
                summary: Example login request
                value:
                  username: user123
                  password: password123
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                example1:
                  summary: Example login response
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Invalid credentials.
        '500':
          description: Internal server error.
  /auth/logout:
    post:
      summary: User logout
      description: Log out the currently authenticated user. Requires an API key for authentication.
      operationId: logoutUser
      tags:
        - Authentication
      security:
        - ApiKeyAuth: []
      responses:
        '204':
          description: Logout successful.
        '401':
          description: Unauthorized. No valid session found.
        '500':
          description: Internal server error.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Use your API key to authenticate requests. Include it in the `X-API-Key` header.
  schemas:
    Trip:
      type: object
      description: Details of a trip.
      properties:
        id:
          type: integer
          description: Unique identifier for the trip.
          example: 1
        destination:
          type: string
          description: Destination of the trip.
          example: Paris
        startDate:
          type: string
          format: date
          description: Start date of the trip.
          example: '2023-12-01'
        endDate:
          type: string
          format: date
          description: End date of the trip.
          example: '2023-12-10'
      example:
        id: 1
        destination: Paris
        startDate: '2023-12-01'
        endDate: '2023-12-10'
    NewTrip:
      type: object
      description: Details required to create a new trip.
      required:
        - destination
        - startDate
        - endDate
      properties:
        destination:
          type: string
          description: Destination of the trip.
          example: Tokyo
        startDate:
          type: string
          format: date
          description: Start date of the trip.
          example: '2024-03-01'
        endDate:
          type: string
          format: date
          description: End date of the trip.
          example: '2024-03-10'
      example:
        destination: Tokyo
        startDate: '2024-03-01'
        endDate: '2024-03-10'
    LoginRequest:
      type: object
      description: User credentials for login.
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: The username of the user.
          example: user123
        password:
          type: string
          description: The password of the user.
          example: password123
    LoginResponse:
      type: object
      description: Response containing the authentication token.
      properties:
        token:
          type: string
          description: JWT token for authenticated requests.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
